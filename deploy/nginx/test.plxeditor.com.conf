server {
    listen 80;
    server_name test.plxeditor.com;

    root /www/wwwroot/test.plxeditor.com;
    index index.html;

    access_log /www/wwwlogs/test.plxeditor.com.log;
    error_log /www/wwwlogs/test.plxeditor.com.error.log;

    location / {
        proxy_pass http://192.168.100.67:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://192.168.100.67:18082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location ~ ^/(docs|redoc|openapi.json|health)$ {
        proxy_pass http://192.168.100.67:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
