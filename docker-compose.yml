services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${APP_CONTAINER_NAME:-video-api}
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - video-temp:/tmp/video-processing
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  video-temp:
